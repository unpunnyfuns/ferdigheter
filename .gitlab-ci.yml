image: python:3.14

stages:
  - lint
  - test
  - check

default:
  before_script:
    - pip install --quiet poetry
    - poetry install --no-interaction
  cache:
    key: poetry-$CI_COMMIT_REF_SLUG
    paths:
      - .venv

lint:
  stage: lint
  script:
    - poetry run ruff check scripts tests
    - poetry run ruff format --check scripts tests

test:
  stage: test
  script:
    - poetry run pytest -q

validate:
  stage: check
  script:
    - poetry run python scripts/registry.py validate
    - poetry run python scripts/registry.py build --check

upstream-drift:
  stage: check
  script:
    - poetry run python scripts/registry.py sync --check
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual
