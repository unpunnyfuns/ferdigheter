[project]
name = "ferdigheter"
version = "0.1.0"
description = "Registry of agent skills in the Agent Skills format"
requires-python = ">=3.14"
dependencies = ["pyyaml (>=6.0.3,<7.0.0)"]

[tool.poetry]
package-mode = false

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.17.1,<0.18.0)"
]
